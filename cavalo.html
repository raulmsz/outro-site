<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haras Elite | Leilão e Venda de Cavalos de Raça</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c5a059;
            --dark-green: #1a2f23;
            --brown: #4e342e;
            --beige: #f5f5f0;
            --white: #ffffff;
            --text: #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--beige); color: var(--text); overflow-x: hidden; }

        /* HEADER & HERO */
        header {
            background: var(--dark-green);
            color: var(--white);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .logo h1 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.8rem; }

        .nav-tools { display: flex; gap: 20px; align-items: center; }

        .search-bar {
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            outline: none;
            width: 250px;
        }

        .cart-trigger {
            background: var(--gold);
            color: var(--dark-green);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            border: none;
            transition: 0.3s;
        }

        /* FILTROS */
        .filters-container {
            background: var(--white);
            padding: 20px 5%;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 2px solid var(--gold);
        }

        .filter-group { display: flex; flex-direction: column; }
        select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; background: white; min-width: 150px; }

        /* GRID DE CAVALOS */
        .catalog { padding: 40px 5%; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }

        .horse-card {
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: 0.4s;
            position: relative;
        }

        .horse-card:hover { transform: translateY(-10px); }

        .horse-img { width: 100%; height: 250px; object-fit: cover; }

        .horse-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--gold);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .horse-info { padding: 20px; }
        .horse-info h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 5px; }
        .horse-spec { font-size: 0.85rem; color: #666; margin-bottom: 15px; }
        
        .price-tag { font-size: 1.5rem; font-weight: 700; color: var(--brown); margin-bottom: 15px; }

        .btn-group { display: flex; gap: 10px; }
        .btn-details { flex: 1; background: #eee; border: none; padding: 10px; cursor: pointer; border-radius: 5px; }
        .btn-buy { flex: 2; background: var(--dark-green); color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; font-weight: 600; }
        .btn-buy:hover { background: var(--brown); }

        /* MODAL DETALHES */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center; align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: white; width: 90%; max-width: 900px; max-height: 90vh;
            border-radius: 20px; display: flex; overflow: hidden; position: relative;
        }

        .modal-img { width: 50%; object-fit: cover; }
        .modal-body { width: 50%; padding: 40px; overflow-y: auto; }
        .close-modal { position: absolute; top: 20px; right: 20px; font-size: 2rem; cursor: pointer; border: none; background: none; }

        /* CARRINHO LATERIAL */
        .cart-panel {
            position: fixed;
            top: 0; right: -400px; width: 400px; height: 100%;
            background: white; box-shadow: -5px 0 20px rgba(0,0,0,0.2);
            transition: 0.4s; z-index: 1500;
            display: flex; flex-direction: column;
        }

        .cart-panel.active { right: 0; }

        .cart-header { padding: 20px; background: var(--dark-green); color: white; display: flex; justify-content: space-between; }
        .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .cart-item img { width: 60px; height: 60px; border-radius: 5px; object-fit: cover; }

        .cart-footer { padding: 20px; background: #f9f9f9; }
        .total-row { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; }

        .btn-whatsapp {
            width: 100%; background: #25d366; color: white; border: none; padding: 15px;
            border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        @media (max-width: 768px) {
            .modal-content { flex-direction: column; }
            .modal-img, .modal-body { width: 100%; }
            .modal-img { height: 250px; }
            .cart-panel { width: 100%; right: -100%; }
        }
    </style>
</head>

                <div id="modal-specs">

                </div>

                </select>

            <button class="btn-whatsapp" onclick="sendWhatsApp()">
                ENVIAR PROPOSTA VIA WHATSAPP
            </button>
        </div>
    </div>
